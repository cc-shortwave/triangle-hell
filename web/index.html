<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>triangle-hell · Web demo (3d-engine-core.js + cube.js)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

<div id="hud">

<script src="3d-engine-core.js"></script>
<script src="cube.js"></script>
