<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>triangle-hell · Web demo (3d-engine-core.js + cube.js)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 2;
    font: 12px/1.7 ui-monospace, Menlo, Consolas, monospace;
    color: #9fb3c8; text-shadow: 0 0 6px #000; pointer-events: none
  }
  #hud b { color: #e7ecf5; font-weight: 600 }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div><b>triangle-hell</b> · WebGL port of the hand-written renderer</div>
  <div>triangles <b id="hTris">—</b> · fps <b id="hFps">—</b></div>
  <div>camera <b id="hCam">—</b></div>
  <div>WASD move · Q/E down/up · arrows look · G game mode</div>
</div>

<script src="3d-engine-core.js"></script>
<script src="cube.js"></script>
<script>
(function () {
  'use strict';

  const E3 = window.Engine3D;
  const canvas = document.getElementById('cv');

  // ---- viewport: CSS size × devicePixelRatio, canvas buffer in device pixels ----
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(canvas.clientWidth * dpr);
    H = Math.round(canvas.clientHeight * dpr);
    canvas.width = W;
    canvas.height = H;
    view = E3.initWebGL(canvas, W, H);   // uniforms depend on size, so rebuild on resize
  }

  // ---- four 300³ cubes, the same layout as the Python version ----
  const objects = [
    new E3.Cube( 320, 0,  320, 300, 300, 300, 0, 0, 0, [2, 2]),
    new E3.Cube(-320, 0,  320, 300, 300, 300, 0, 0, 0, [2, 2]),
    new E3.Cube( 320, 0, -320, 300, 300, 300, 0, 0, 0, [2, 2]),
    new E3.Cube(-320, 0, -320, 300, 300, 300, 0, 0, 0, [2, 2])
  ];

  // ---- camera: same class as the Python one (Y-up, Ry·Rx·Rz) ----
  const camera = new E3.Camera();
  const FOV = 80, FAR = 15000;

  // Point the camera at the origin: forward = Ry(yaw)·Rx(pitch)·[0,0,1]
  function lookAt(target) {
    const d = [target[0] - camera.position[0],
               target[1] - camera.position[1],
               target[2] - camera.position[2]];
    const n = Math.hypot(d[0], d[1], d[2]) || 1;
    const f = [d[0] / n, d[1] / n, d[2] / n];
    camera.euler_angles = [-Math.asin(f[1]), Math.atan2(f[0], f[2]), 0];
    camera.update(0, 0, 0, 0, 0, false);   // refresh rotation matrix / basis vectors
  }

  camera.position = [0, 430, -1180];
  lookAt([0, 0, 0]);

  // ---- input ----
  const keys = Object.create(null);
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'g' || e.key === 'G') gameMode = !gameMode;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  let gameMode = false;

  // ---- frame loop ----
  const hTris = document.getElementById('hTris');
  const hFps  = document.getElementById('hFps');
  const hCam  = document.getElementById('hCam');
  let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShown = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;

    // camera: arrows turn, WASD/QE translate. Deltas are per second and scaled here.
    const turn = 1.2 * dt;
    const step = 900 * dt;
    const phi   = (keys['arrowleft'] ? -turn : 0) + (keys['arrowright'] ? turn : 0);
    const theta = (keys['arrowup']   ? -turn : 0) + (keys['arrowdown']  ? turn : 0);
    const xm = (keys['d'] ? step : 0) + (keys['a'] ? -step : 0);
    const ym = (keys['e'] ? step : 0) + (keys['q'] ? -step : 0);
    const zm = (keys['w'] ? step : 0) + (keys['s'] ? -step : 0);
    if (phi || theta || xm || ym || zm) camera.update(phi, theta, xm, ym, zm, gameMode);

    const stats = E3.renderFrame(view.gl, view.vertexBuffer, camera, objects, W, H, FOV, FAR);

    // HUD
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) { fpsShown = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
    hTris.textContent = stats.triangles + ' / ' + objects.reduce((a, o) => a + o.triangles.length, 0);
    hFps.textContent = fpsShown;
    hCam.textContent = camera.position.map(v => v.toFixed(0)).join(', ') + (gameMode ? '  [game]' : '  [free]');

    requestAnimationFrame(frame);
  }

  let view;
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
